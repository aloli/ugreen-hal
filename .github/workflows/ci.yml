# CI — validation sous FreeBSD (via vmactions/freebsd-vm)
#
# STATUT : squelette. Ce workflow ne fait pour l'instant que valider la
# syntaxe des documents AsciiDoc et préparer l'environnement FreeBSD pour
# les futurs tests de src/cli/. À enrichir au sprint 1/3, une fois du code
# effectif présent dans src/cli/ et tests/.

name: CI

on:
  push:
    branches: [development]
  pull_request:

jobs:
  freebsd-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build and test on FreeBSD
        uses: vmactions/freebsd-vm@v1
        with:
          usesh: true
          prepare: |
            # Asciidoctor est une gem Ruby : sous FreeBSD le paquet s'appelle
            # rubygem-asciidoctor (textproc/), pas asciidoctor.
            pkg install -y rubygem-asciidoctor
          run: |
            # `set -e` est indispensable : sans lui, une erreur de validation
            # n'interromprait pas le script et le job afficherait « OK » à tort.
            set -e

            # Boucle `for` volontairement, et non `find -exec` : find ignore le
            # code de retour de -exec, ce qui laissait passer un document
            # invalide sans faire échouer le job.
            for doc in $(find . -name '*.adoc' -not -path './.git/*'); do
              echo "Validation : ${doc}"
              asciidoctor --safe-mode=safe -o /dev/null "${doc}"
            done
            echo "OK : documents AsciiDoc valides."

            # Compilation du cœur du HAL. C'est le seul endroit où le code
            # rencontre les véritables en-têtes FreeBSD (dev/smbus/smb.h) :
            # la machine de développement est un Mac, où il ne peut être que
            # vérifié syntaxiquement contre un en-tête reconstitué.
            echo
            echo "Compilation de src/cli/ :"
            make -C src/cli
            echo "OK : src/cli compile sous FreeBSD."
